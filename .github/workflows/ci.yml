name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsh-terminal-manager
        uses: actions/checkout@v4

      # setup-node 的 pnpm 缓存需要先装好 pnpm；顺序反了会报 “Unable to locate executable file: pnpm”。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dsh-terminal-manager deps
        run: pnpm install

      - name: Build (tsdown host + browser halves)
        run: pnpm build

      # lib/ 入库供 `dsh plugin add github:...` 直接安装；这里守住产物与源码一致，
      # 避免 git 安装装到旧代码。改 src 后记得 pnpm build 并提交 lib/。
      - name: Check committed lib matches source
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ 与源码构建结果不一致，请运行 pnpm build 并提交 lib/。"
            exit 1
          fi

      - name: Unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/