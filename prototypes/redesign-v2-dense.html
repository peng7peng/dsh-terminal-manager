<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重新设计 v2 — 紧凑平铺网格（Dense Grid）</title>
<style>
  /* 单一深色工具基调（观感非本次比较变量，结构才是） */
  :root {
    --bg: #0f1218; --panel: #171b23; --panel2: #1f242e; --border: #2a3040;
    --text: #d7dce6; --dim: #8b93a6; --accent: #5b8cff; --accent-soft: #1c2740;
    --ok: #36d399; --warn: #f2b64b; --err: #f1706b;
    --term-bg: #0a0d12; --term-text: #cdd7e6; --term-cmd: #7aa7ff; --term-sys: #6f7a8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* 一体式 header：应用名 + 页签 + 在线统计，压成单条以省高度 */
  .top { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .top .brand { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
  .top .brand small { color: var(--dim); font-weight: 500; margin-left: 6px; font-size: 11px; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 5px 14px; cursor: pointer; color: var(--dim); border-radius: 8px; font-size: 12.5px; font-weight: 600; user-select: none; border: 1px solid transparent; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent); border-color: #5b8cff44; }
  .tab .badge { background: var(--accent); color: #08152e; border-radius: 8px; font-size: 10px; padding: 0 6px; margin-left: 4px; font-weight: 700; }
  .top .spacer { flex: 1; }
  .online { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .online b { color: var(--ok); }

  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .page.active { display: flex; }

  /* ── 状态条：一行紧凑芯片；✕ 是唯一断开入口 ── */
  .strip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--panel2); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; white-space: nowrap; font-weight: 600; cursor: pointer; color: var(--dim); user-select: none; flex-shrink: 0; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.off { cursor: pointer; }
  .chip.hid { opacity: .5; border-style: dashed; }
  .chip .led { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .led.on { background: var(--ok); box-shadow: 0 0 4px var(--ok); }
  .led.connecting { background: var(--warn); animation: spin 1s linear infinite; }
  .led.off { background: var(--dim); opacity: .5; }
  @keyframes spin { 0%{transform:scale(1)} 50%{transform:scale(.6)} 100%{transform:scale(1)} }
  .chip .x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11px; padding: 0 1px; margin-left: 1px; line-height: 1; }
  .chip .x:hover { color: var(--err); }
  .chip .play { color: var(--accent); }

  /* ── 终端网格：紧凑、小间距、卡片压薄、标题条瘦身 ── */
  .gridwrap { flex: 1; overflow: auto; padding: 10px 12px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .viewmode { font-size: 11px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; align-content: start; }
  .grid.maximized .term { display: none; }
  .grid.maximized .term.focus { display: flex; }
  .term { background: var(--term-bg); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 150px; overflow: hidden; }
  .term-bar { display: flex; align-items: center; gap: 7px; padding: 5px 9px; background: var(--panel2); border-bottom: 1px solid var(--border); font-size: 12px; flex-shrink: 0; }
  .term-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .term-bar .name { font-weight: 700; font-family: Consolas, monospace; }
  .term-bar .target { color: var(--dim); font-family: Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .term-bar button { margin-left: auto; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
  .term-bar button:hover { color: var(--accent); }
  .term-body { flex: 1; overflow-y: auto; padding: 6px 9px; color: var(--term-text); font: 12px/1.5 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-all; }
  .term-body .cmd { color: var(--term-cmd); }
  .term-body .sys { color: var(--term-sys); }
  .term-input { display: flex; align-items: center; border-top: 1px solid var(--border); padding: 0 9px; background: var(--panel2); flex-shrink: 0; }
  .term-input span { color: var(--accent); font-family: Consolas, monospace; font-weight: 700; }
  .term-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font: 12px Consolas, monospace; padding: 6px 8px; }

  /* ── 广播栏：一条紧凑行 ── */
  .broadcast { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel2); border-top: 1px solid var(--border); flex-shrink: 0; }
  .broadcast .lb { font-size: 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .bchips { display: flex; gap: 4px; flex-wrap: wrap; }
  .bchip { font-size: 11px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--dim); user-select: none; white-space: nowrap; font-weight: 600; }
  .bchip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .broadcast input { flex: 1; min-width: 80px; background: var(--term-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 9px; font: 12px Consolas, monospace; outline: none; }
  .broadcast input:focus { border-color: var(--accent); }

  button.glow { background: var(--accent); border: none; color: #08152e; border-radius: 6px; padding: 5px 14px; font-weight: 700; cursor: pointer; font-size: 12px; white-space: nowrap; }
  button.glow:hover { filter: brightness(1.08); }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.danger:hover { border-color: var(--err); color: var(--err); }

  /* ── 连接页：密度适中的卡片列表 ── */
  .connpage { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .conn-wrap { flex: 1; overflow: auto; padding: 12px; }
  .conn-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; align-content: start; }
  .conn { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .conn .top { display: flex; align-items: center; gap: 8px; }
  .conn .proto { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-family: Consolas, monospace; }
  .proto.ssh { background: var(--accent-soft); color: var(--accent); }
  .proto.telnet { background: #f2b64b22; color: var(--warn); }
  .conn .label { font-weight: 700; font-size: 14px; }
  .conn .addr { color: var(--dim); font-family: Consolas, monospace; font-size: 11.5px; }
  .conn .actions { display: flex; gap: 6px; margin-top: 2px; }
  .status { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; margin-left: auto; white-space: nowrap; }
  .status.off { color: var(--dim); background: var(--panel2); }
  .status.connecting { color: var(--warn); background: #f2b64b1a; }
  .status.on { color: var(--ok); background: #36d3991a; }

  /* ── 表单（抽屉式，右侧滑出，点击遮罩取消） ── */
  .drawer-mask { position: fixed; inset: 0; background: #05070b88; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .conn-form { position: fixed; top: 0; right: 0; height: 100vh; width: min(360px, 92vw); background: var(--panel); border-left: 1px solid var(--border); padding: 18px; display: flex; flex-direction: column; gap: 12px; transform: translateX(100%); transition: transform .22s ease; z-index: 10; overflow-y: auto; }
  .conn-form.open { transform: translateX(0); }
  .conn-form h3 { font-size: 14px; }
  .conn-form .legend { font-size: 11.5px; color: var(--dim); }
  .req { color: var(--err); font-weight: 700; }
  .opt-tag { font-size: 10.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--dim); }
  .field input, .field select { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 7px 10px; font-size: 12.5px; outline: none; width: 100%; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field.error input { border-color: var(--err); background: #f1706b12; }
  .field .hint { font-size: 11px; color: var(--err); display: none; }
  .field.error .hint { display: block; }
  .auth-switch { display: flex; gap: 6px; }
  .auth-switch span { font-size: 12px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; color: var(--dim); font-weight: 600; user-select: none; }
  .auth-switch span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .form-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="top">
  <div class="brand">🖥️ 终端管理 <small>v2 · 紧凑平铺</small></div>
  <div class="tabs">
    <div class="tab active" data-page="terms">终端 <span class="badge" id="termCount">0</span></div>
    <div class="tab" data-page="conns">连接</div>
  </div>
  <span class="spacer"></span>
  <span class="online">在线 <b id="onlineCount">0</b> / <span id="allCount">0</span></span>
</div>

<main>
  <!-- 终端页 -->
  <div class="page active" id="page-terms">
    <div class="strip" id="strip"></div>
    <div class="gridwrap">
      <div class="toolbar">
        <span class="viewmode" id="viewmode">网格视图</span>
        <span style="flex:1"></span>
        <button class="ghost" onclick="switchTab('conns')">＋ 连接新设备</button>
      </div>
      <div class="grid" id="termGrid"></div>
    </div>
    <div class="broadcast">
      <span class="lb">📢 广播</span>
      <div class="bchips" id="bchips"></div>
      <input id="bcInput" placeholder="输入命令，发给选中的会话…" />
      <button class="glow" id="bcSend" onclick="broadcast()">发送</button>
    </div>
  </div>

  <!-- 连接页 -->
  <div class="page" id="page-conns">
    <div class="connpage">
      <div class="conn-wrap">
        <div class="conn-list" id="connList"></div>
      </div>
      <div style="padding: 0 12px 12px;"><button class="glow" onclick="openForm()">＋ 新建连接</button></div>
    </div>
  </div>
</main>

<div class="drawer-mask" id="mask" onclick="closeForm()"></div>
<div class="conn-form" id="connForm">
  <h3 id="formTitle">新建连接</h3>
  <div class="legend"><span class="req">*</span> 必填；「选填」可留空（密码 / 私钥按认证方式二选一必填）</div>
  <div class="row" style="display:flex;gap:8px;">
    <div class="field" id="fwLabel" style="flex:1"><label>名称 <span class="req">*</span></label><input id="fLabel" placeholder="如 web-01" /><span class="hint">请填写名称</span></div>
    <div class="field" style="flex:0 0 96px"><label>协议 <span class="req">*</span></label><select id="fProto" onchange="onProtoChange()"><option value="ssh">SSH</option><option value="telnet">Telnet</option></select></div>
  </div>
  <div class="row" style="display:flex;gap:8px;">
    <div class="field" id="fwHost" style="flex:1"><label>IP 地址 <span class="req">*</span></label><input id="fHost" placeholder="192.168.1.10" /><span class="hint">请填写 IP</span></div>
    <div class="field" style="flex:0 0 100px"><label>端口 <span class="req">*</span></label><input id="fPort" placeholder="22" /><span class="hint"></span></div>
  </div>
  <div id="sshAuthBlock">
    <div class="row" style="display:flex;gap:8px;">
      <div class="field" id="fwUser" style="flex:1"><label>用户名 <span class="req">*</span>（SSH）</label><input id="fUser" placeholder="admin" /><span class="hint">SSH 需用户名</span></div>
      <div class="field" style="flex:0 0 130px"><label>认证方式 <span class="req">*</span></label>
        <div class="auth-switch"><span class="on" id="authPwd" onclick="setAuth('password')">密码</span><span id="authKey" onclick="setAuth('key')">密钥</span></div>
      </div>
    </div>
    <div id="pwdRow">
      <div class="field" id="fwPass"><label>密码 <span class="req">*</span></label><input id="fPass" type="password" placeholder="登录密码" /><span class="hint">选密码认证时必填</span></div>
    </div>
    <div id="keyRow" style="display:none;">
      <div class="row" style="display:flex;gap:8px;">
        <div class="field" id="fwKey" style="flex:2"><label>私钥 <span class="req">*</span></label><input id="fKey" placeholder="私钥内容或路径" /><span class="hint">选密钥认证时必填</span></div>
        <div class="field" style="flex:1"><label>口令 <span class="opt-tag">选填</span></label><input id="fPassphrase" type="password" placeholder="私钥口令" /></div>
      </div>
    </div>
  </div>
  <div id="telnetAuthBlock" style="display:none;">
    <div class="row" style="display:flex;gap:8px;">
      <div class="field" style="flex:1"><label>用户名 <span class="opt-tag">选填</span>（Telnet）</label><input id="fTUser" placeholder="需要登录时填" /></div>
      <div class="field" style="flex:1"><label>密码 <span class="opt-tag">选填</span>（Telnet）</label><input id="fTPass" type="password" placeholder="需要登录时填" /></div>
    </div>
  </div>
  <div class="field"><label>备注 <span class="opt-tag">选填</span></label><input id="fNote" placeholder="用途、位置等备忘" /></div>
  <div class="form-foot">
    <button class="ghost" onclick="closeForm()">取消</button>
    <button class="glow" onclick="saveConn()">保存连接</button>
  </div>
</div>

<script>
const CONNS = [
  { id:'c1', label:'web-01', proto:'ssh', host:'10.0.1.5', port:22, user:'admin', note:'前台测试服务器', status:'off' },
  { id:'c2', label:'db-02', proto:'telnet', host:'10.0.1.8', port:23, user:'', note:'', status:'off' },
  { id:'c3', label:'cache-03', proto:'ssh', host:'10.0.1.12', port:22, user:'root', note:'缓存节点', status:'off' },
  { id:'c4', label:'sw-04', proto:'ssh', host:'10.0.1.9', port:22, user:'admin', note:'汇聚交换机', status:'off' },
  { id:'c5', label:'esl-lab7', proto:'telnet', host:'10.0.1.20', port:23, user:'', note:'ESL 环境', status:'off' },
];
const SESSIONS = []; // { id, connId, lines:[], hidden }
let editing=null, seq=0, authMode='password', maxSid=null;
const $ = id => document.getElementById(id);
const FAKE_OUTPUT = cmd => [`执行: ${cmd}`,'----------------------------------------','Interface      Status    Protocol','Gig0/0         up        up','Gig0/1         up        up',`完成于 ${new Date().toLocaleTimeString()}`];
const promptOf = c => `${c.label}${c.proto==='ssh'?'$':'>'} `;
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function switchTab(p){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.page));

/* 状态条：唯一断开入口 ✕；点芯片=显隐 */
function renderStrip(){
  const on=CONNS.filter(c=>c.status==='on').length;
  $('onlineCount').textContent=on; $('allCount').textContent=CONNS.length;
  $('strip').innerHTML=CONNS.map(c=>{
    const s=SESSIONS.find(x=>x.connId===c.id);
    const hid=s&&s.hidden;
    return `<span class="chip ${c.status==='on'?'':'off'} ${hid?'hid':''}" ${c.status==='on'?`onclick="toggleHide('${c.id}')" title="点我显示/隐藏（不断开）"`:''}>
      <span class="led ${c.status}"></span>${c.label}
      ${c.status==='on'?`<button class="x" onclick="event.stopPropagation();disconnect('${c.id}')" title="断开">✕</button>`:`<button class="play" onclick="event.stopPropagation();connect('${c.id}')" title="连接">▶</button>`}
    </span>`;
  }).join('');
}
function toggleHide(connId){const s=SESSIONS.find(x=>x.connId===connId);if(!s)return;s.hidden=!s.hidden;if(s.hidden&&maxSid===s.id)maxSid=null;renderStrip();renderTerms();}

/* 连接 */
function connect(id){
  const c=CONNS.find(x=>x.id===id);
  if(c.status!=='off')return;
  c.status='connecting';renderStrip();renderConns();
  setTimeout(()=>{ c.status='on';renderStrip();renderConns(); openSession(c); switchTab('terms'); },700);
}
function disconnect(connId){
  const c=CONNS.find(x=>x.id===connId); if(c)c.status='off';
  const i=SESSIONS.findIndex(s=>s.connId===connId);
  if(i>=0){ if(SESSIONS[i].id===maxSid)maxSid=null; SESSIONS.splice(i,1); }
  renderStrip();renderConns();renderTerms();
}
function openSession(c){
  if(SESSIONS.some(s=>s.connId===c.id))return;
  const s={id:'s'+(++seq),connId:c.id,lines:[],hidden:false};
  SESSIONS.push(s);
  pushLine(s,`[已连接 ${c.host}:${c.port}]`,'sys');
  pushLine(s,c.proto==='ssh'?`Welcome to ${c.label} (SSH)`:`Connected to ${c.label}`,'sys');
  pushLine(s,promptOf(c),'sys');
  renderTerms();
}

/* 连接卡片 */
function renderConns(){
  $('connList').innerHTML=CONNS.map(c=>`
    <div class="conn">
      <div class="top">
        <span class="proto ${c.proto}">${c.proto.toUpperCase()}</span>
        <span class="label">${c.label}</span>
        <span class="status ${c.status}">${c.status==='on'?'● 已连接':c.status==='connecting'?'◐ 连接中…':'未连接'}</span>
      </div>
      <div class="addr">${c.host}:${c.port}${c.user?' · '+c.user:''}${c.note?' · '+c.note:''}</div>
      <div class="actions">
        <button class="glow" onclick="connect('${c.id}')">${c.status==='on'?'已连接':c.status==='connecting'?'连接中…':'连接'}</button>
        <button class="ghost" onclick="editConn('${c.id}')">编辑</button>
        <button class="ghost danger" onclick="delConn('${c.id}')">删除</button>
      </div>
    </div>`).join('');
}

/* 终端 */
function pushLine(s,text,cls){s.lines.push({text,cls});if(s.lines.length>400)s.lines.shift();}
function renderTerms(){
  $('termCount').textContent=SESSIONS.length;
  const vis=SESSIONS.filter(s=>!s.hidden);
  $('viewmode').textContent=maxSid?(CONNS.find(x=>x.id===SESSIONS.find(s=>s.id===maxSid).connId)?.label+' · 聚焦'):'网格视图';
  $('termGrid').innerHTML=SESSIONS.length===0
    ? `<div style="color:var(--dim);padding:40px;text-align:center;">还没有已连接的会话 🌱<br>点上方状态条的 ▶ 或到「连接」页签连设备</div>`
    : vis.length===0
    ? `<div style="color:var(--dim);padding:40px;text-align:center;">所有终端已隐藏 —— 点上方设备芯片恢复显示<br>（连接保持，随时恢复）</div>`
    : vis.map(s=>{
        const c=CONNS.find(x=>x.id===s.connId);
        return `<div class="term" data-sid="${s.id}">
          <div class="term-bar"><span class="dot"></span><span class="name">${c.label}</span><span class="target">${c.host}:${c.port}</span><button onclick="toggleMax('${s.id}')" title="最大化/还原">⛶</button></div>
          <div class="term-body" id="body-${s.id}">${s.lines.map(l=>`<div class="${l.cls||''}">${esc(l.text)}</div>`).join('')}</div>
          <div class="term-input"><span>${c.proto==='ssh'?'$':'>'}</span><input placeholder="输入命令…" onkeydown="if(event.key==='Enter'){sendCmd('${s.id}',this.value);this.value=''}"/></div>
        </div>`;
      }).join('');
  const grid=$('termGrid');
  grid.classList.toggle('maximized',maxSid!==null);
  grid.querySelectorAll('.term').forEach(t=>t.classList.toggle('focus',t.dataset.sid===maxSid));
  SESSIONS.forEach(s=>{const el=$('body-'+s.id);if(el)el.scrollTop=el.scrollHeight;});
  renderBchips();
}
function toggleMax(sid){maxSid=maxSid===sid?null:sid;renderTerms();}
function sendCmd(sid,cmd){
  if(!cmd.trim())return;
  const s=SESSIONS.find(x=>x.id===sid);const c=CONNS.find(x=>x.id===s.connId);
  pushLine(s,promptOf(c)+cmd,'cmd');
  stream(s,c,FAKE_OUTPUT(cmd));
}
function stream(s,c,lines){let i=0;const t=setInterval(()=>{if(i>=lines.length){clearInterval(t);pushLine(s,promptOf(c),'sys');renderTerms();return;}pushLine(s,lines[i++]);renderTerms();},160);}

/* 广播 */
function renderBchips(){
  $('bchips').innerHTML=`<span class="bchip on" data-id="*" onclick="chipAll()">全部</span>`+SESSIONS.map(s=>{
    const c=CONNS.find(x=>x.id===s.connId);
    return `<span class="bchip on" data-id="${s.id}" onclick="chipToggle(this)">${c.label}</span>`;
  }).join('');
  updateBcCount();
}
function chipToggle(el){el.classList.toggle('on');syncAll();updateBcCount();}
function chipAll(){const ind=[...document.querySelectorAll('.bchip:not([data-id="*"])')];const allOn=ind.length>0&&ind.every(c=>c.classList.contains('on'));ind.forEach(c=>c.classList.toggle('on',!allOn));document.querySelector('.bchip[data-id="*"]').classList.toggle('on',!allOn);updateBcCount();}
function syncAll(){const ind=[...document.querySelectorAll('.bchip:not([data-id="*"])')];document.querySelector('.bchip[data-id="*"]').classList.toggle('on',ind.length>0&&ind.every(c=>c.classList.contains('on')));}
function selTargets(){return [...document.querySelectorAll('.bchip.on:not([data-id="*"])')].map(c=>c.dataset.id);}
function updateBcCount(){const n=selTargets().length;$('bcSend').textContent=n>0?`发送（${n}）`:'发送';}
function broadcast(){const cmd=$('bcInput').value.trim();if(!cmd)return;const tg=selTargets();if(!tg.length)return;$('bcInput').value='';tg.forEach(sid=>{if(SESSIONS.some(s=>s.id===sid))sendCmd(sid,cmd);});}

/* 表单（抽屉） */
function openForm(){editing=null;$('formTitle').textContent='新建连接';clearForm();$('mask').classList.add('open');$('connForm').classList.add('open');}
function closeForm(){$('mask').classList.remove('open');$('connForm').classList.remove('open');}
function clearForm(){['fLabel','fHost','fPort','fUser','fPass','fKey','fPassphrase','fTUser','fTPass','fNote'].forEach(id=>$(id).value='');$('fProto').value='ssh';authMode='password';onProtoChange();clearErrors();}
function clearErrors(){document.querySelectorAll('.field.error').forEach(f=>f.classList.remove('error'));}
function onProtoChange(){const ssh=$('fProto').value==='ssh';$('sshAuthBlock').style.display=ssh?'block':'none';$('pwdRow').style.display=ssh&&authMode==='password'?'block':'none';$('keyRow').style.display=ssh&&authMode==='key'?'block':'none';$('telnetAuthBlock').style.display=ssh?'none':'block';$('fPort').placeholder=ssh?'22':'23';clearErrors();}
function setAuth(m){authMode=m;$('authPwd').classList.toggle('on',m==='password');$('authKey').classList.toggle('on',m==='key');$('pwdRow').style.display=m==='password'?'block':'none';$('keyRow').style.display=m==='key'?'block':'none';clearErrors();}
function markError(id){$(id).classList.add('error');}
function saveConn(){clearErrors();const ssh=$('fProto').value==='ssh';let bad=false;
  if(!$('fLabel').value.trim()){markError('fwLabel');bad=true;}
  if(!$('fHost').value.trim()){markError('fwHost');bad=true;}
  if(ssh){if(!$('fUser').value.trim()){markError('fwUser');bad=true;}if(authMode==='password'&&!$('fPass').value){markError('fwPass');bad=true;}if(authMode==='key'&&!$('fKey').value.trim()){markError('fwKey');bad=true;}}
  if(bad)return;
  const data={label:$('fLabel').value.trim(),proto:$('fProto').value,host:$('fHost').value.trim(),port:+$('fPort').value||(ssh?22:23),user:ssh?$('fUser').value.trim():$('fTUser').value.trim(),note:$('fNote').value.trim(),status:'off'};
  if(editing)Object.assign(CONNS.find(x=>x.id===editing),data);else CONNS.push({id:'c'+Date.now(),...data});
  closeForm();renderConns();renderStrip();
}
function editConn(id){const c=CONNS.find(x=>x.id===id);editing=id;$('formTitle').textContent='编辑连接：'+c.label;clearForm();$('fLabel').value=c.label;$('fProto').value=c.proto;$('fHost').value=c.host;$('fPort').value=c.port;$('fNote').value=c.note??'';onProtoChange();if(c.proto==='ssh'){$('fUser').value=c.user??'';}else{$('fTUser').value=c.user??'';}$('mask').classList.add('open');$('connForm').classList.add('open');}
function delConn(id){disconnect(id);const i=CONNS.findIndex(x=>x.id===id);if(i>=0)CONNS.splice(i,1);renderConns();renderStrip();}

renderConns();renderStrip();renderTerms();
</script>
</body>
</html>
