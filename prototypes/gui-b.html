<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 B — 明亮卡片（轻快直观）</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --border: #e3e8f0; --text: #24292f; --dim: #6e7a8a;
    --accent: #4f6ef7; --accent-soft: #eef1fe; --ok: #1a9e5c; --warn: #c77700; --err: #d64545;
    --term-bg: #1e2530; --term-text: #dbe4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 700; }
  header .tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 2px 10px; }
  .tabs { display: flex; gap: 8px; margin-left: 16px; }
  .tab { padding: 7px 18px; cursor: pointer; color: var(--dim); border-radius: 20px; user-select: none; font-weight: 600; font-size: 13px; }
  .tab:hover { background: #eceff5; }
  .tab.active { background: var(--accent-soft); color: var(--accent); }
  .tab .badge { background: var(--accent); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; margin-left: 4px; }
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 14px; }
  .page { display: none; flex: 1; overflow: hidden; flex-direction: column; gap: 12px; }
  .page.active { display: flex; }

  /* ── 终端页 ── */
  .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; overflow: auto; }
  .term { background: var(--card); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; min-height: 230px; overflow: hidden; box-shadow: 0 2px 10px #1a234008; }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .term-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .term-bar .name { font-weight: 700; }
  .term-bar .target { color: var(--dim); font-size: 12px; }
  .term-bar button { margin-left: auto; }
  .term-body { flex: 1; overflow-y: auto; padding: 10px 14px; background: var(--term-bg); color: var(--term-text); font: 12.5px/1.55 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-all; }
  .term-body .cmd { color: #8fb7ff; }
  .term-body .sys { color: #7d8aa0; }
  .term-input { display: flex; align-items: center; border-top: 1px solid var(--border); padding: 0 12px; background: #fafbfe; }
  .term-input span { color: var(--accent); font-family: Consolas, monospace; font-weight: 700; }
  .term-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font: 13px Consolas, monospace; padding: 9px 10px; }

  /* ── 广播卡片 ── */
  .broadcast { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 2px 10px #1a234008; }
  .broadcast label { color: var(--dim); font-size: 13px; font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 4px 12px; border: 1.5px solid var(--border); border-radius: 14px; cursor: pointer; color: var(--dim); user-select: none; background: #fff; font-weight: 600; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .broadcast input { flex: 1; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); padding: 8px 14px; font: 13px Consolas, monospace; outline: none; }
  .broadcast input:focus { border-color: var(--accent); }

  /* ── 连接页 ── */
  .conn-list { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-content: start; }
  .conn { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px #1a234008; display: flex; flex-direction: column; gap: 10px; }
  .conn .top { display: flex; align-items: center; gap: 10px; }
  .conn .proto { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 8px; font-family: Consolas, monospace; }
  .proto.ssh { background: var(--accent-soft); color: var(--accent); }
  .proto.telnet { background: #fff3e0; color: var(--warn); }
  .conn .label { font-weight: 700; font-size: 15px; }
  .conn .addr { color: var(--dim); font-family: Consolas, monospace; font-size: 12.5px; }
  .conn .actions { display: flex; gap: 8px; margin-top: 2px; }
  .status { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; margin-left: auto; }
  .status.off { color: var(--dim); background: #eceff5; }
  .status.connecting { color: var(--warn); background: #fff3e0; }
  .status.on { color: var(--ok); background: #e5f6ec; }
  button { background: #fff; color: var(--text); border: 1.5px solid var(--border); border-radius: 10px; padding: 6px 16px; cursor: pointer; font-size: 13px; font-weight: 600; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3d5ce5; color: #fff; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .conn-form { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 16px; display: none; flex-direction: column; gap: 10px; }
  .conn-form.open { display: flex; }
  .conn-form .row { display: flex; gap: 10px; }
  .conn-form input, .conn-form select { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); padding: 8px 12px; font-size: 13px; outline: none; flex: 1; }
  .conn-form input:focus, .conn-form select:focus { border-color: var(--accent); }
  .foot { padding: 8px 20px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>🖥️ 终端管理</h1><span class="tag">原型 B · 明亮卡片</span>
  <div class="tabs">
    <div class="tab active" data-page="terms">终端 <span class="badge" id="termCount">0</span></div>
    <div class="tab" data-page="conns">连接</div>
  </div>
</header>
<main>
  <div class="page active" id="page-terms">
    <div class="grid" id="termGrid"></div>
    <div class="broadcast">
      <label>📢 广播到</label>
      <div class="chips" id="chips"></div>
      <input id="bcInput" placeholder="输入命令，发给选中的全部会话…" />
      <button class="primary" onclick="broadcast()">发送</button>
    </div>
  </div>
  <div class="page" id="page-conns">
    <div class="conn-list" id="connList"></div>
    <div class="conn-form" id="connForm">
      <div class="row">
        <input id="fLabel" placeholder="名称，如 web-01" />
        <select id="fProto"><option value="ssh">SSH</option><option value="telnet">Telnet</option></select>
      </div>
      <div class="row">
        <input id="fHost" placeholder="IP 地址" />
        <input id="fPort" placeholder="端口" style="max-width: 110px;" />
        <input id="fUser" placeholder="用户名（SSH）" />
        <input id="fPass" placeholder="密码" type="password" />
      </div>
      <div class="row" style="justify-content: flex-end; gap: 10px;">
        <button onclick="closeForm()">取消</button>
        <button class="primary" onclick="saveConn()">保存连接</button>
      </div>
    </div>
    <div><button class="primary" onclick="openForm()">＋ 新建连接</button></div>
  </div>
</main>
<div class="foot">原型仅模拟数据 · 真实实现中此处为 SSH/Telnet 实时连接 · 聊天区位于本面板左侧（DSH 原生）</div>

<script>
const CONNS = [
  { id: 'c1', label: 'web-01', proto: 'ssh', host: '10.0.1.5', port: 22, user: 'admin', status: 'off' },
  { id: 'c2', label: 'db-02', proto: 'telnet', host: '10.0.1.8', port: 23, user: '', status: 'off' },
  { id: 'c3', label: 'backup-03', proto: 'ssh', host: '10.0.2.3', port: 22, user: 'root', status: 'off' },
];
const SESSIONS = [];
let editing = null, seq = 0;

const $ = id => document.getElementById(id);
const FAKE_OUTPUT = cmd => [
  `执行: ${cmd}`,
  '----------------------------------------',
  'Interface      Status    Protocol',
  'Gig0/0         up        up',
  'Gig0/1         up        up',
  'Loopback0      up        up',
  `完成于 ${new Date().toLocaleTimeString()}`,
];

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('page-' + t.dataset.page).classList.add('active');
});

function renderConns() {
  $('connList').innerHTML = CONNS.map(c => `
    <div class="conn">
      <div class="top">
        <span class="proto ${c.proto}">${c.proto.toUpperCase()}</span>
        <span class="label">${c.label}</span>
        <span class="status ${c.status}">${c.status === 'on' ? '● 已连接' : c.status === 'connecting' ? '◐ 连接中…' : '未连接'}</span>
      </div>
      <div class="addr">${c.host}:${c.port}${c.user ? ' · 用户 ' + c.user : ''}</div>
      <div class="actions">
        <button class="primary" onclick="toggleConn('${c.id}')">${c.status === 'on' ? '断开' : '连接'}</button>
        <button onclick="editConn('${c.id}')">编辑</button>
        <button class="danger" onclick="delConn('${c.id}')">删除</button>
      </div>
    </div>`).join('');
}
function toggleConn(id) {
  const c = CONNS.find(x => x.id === id);
  if (c.status === 'on') { disconnect(id); return; }
  c.status = 'connecting'; renderConns();
  setTimeout(() => { c.status = 'on'; renderConns(); openSession(c); }, 800);
}
function openSession(c) {
  if (SESSIONS.some(s => s.connId === c.id)) { switchToTerms(); return; }
  const s = { id: 's' + (++seq), connId: c.id, lines: [] };
  SESSIONS.push(s);
  pushLine(s, `[已连接 ${c.host}:${c.port}]`, 'sys');
  pushLine(s, c.proto === 'ssh' ? `Welcome to ${c.label} (SSH)` : `Connected to ${c.label}`, 'sys');
  pushLine(s, promptOf(c), 'sys');
  renderTerms(); switchToTerms();
}
function disconnect(connId) {
  const c = CONNS.find(x => x.id === connId);
  c.status = 'off';
  const i = SESSIONS.findIndex(s => s.connId === connId);
  if (i >= 0) SESSIONS.splice(i, 1);
  renderConns(); renderTerms();
}
function openForm() { editing = null; ['fLabel','fHost','fPort','fUser','fPass'].forEach(id => $(id).value = ''); $('connForm').classList.add('open'); }
function closeForm() { $('connForm').classList.remove('open'); }
function editConn(id) {
  const c = CONNS.find(x => x.id === id); editing = id;
  $('fLabel').value = c.label; $('fProto').value = c.proto; $('fHost').value = c.host;
  $('fPort').value = c.port; $('fUser').value = c.user; $('fPass').value = '';
  $('connForm').classList.add('open');
}
function saveConn() {
  const data = { label: $('fLabel').value || 'unnamed', proto: $('fProto').value, host: $('fHost').value || '127.0.0.1', port: +$('fPort').value || ($('fProto').value === 'ssh' ? 22 : 23), user: $('fUser').value, status: 'off' };
  if (editing) Object.assign(CONNS.find(x => x.id === editing), data);
  else CONNS.push({ id: 'c' + Date.now(), ...data });
  closeForm(); renderConns();
}
function delConn(id) { disconnect(id); const i = CONNS.findIndex(x => x.id === id); if (i >= 0) CONNS.splice(i, 1); renderConns(); }

const promptOf = c => `${c.label}${c.proto === 'ssh' ? '$' : '>'} `;
function pushLine(s, text, cls) { s.lines.push({ text, cls }); if (s.lines.length > 400) s.lines.shift(); }
function renderTerms() {
  $('termCount').textContent = SESSIONS.length;
  $('termGrid').innerHTML = SESSIONS.length === 0
    ? '<div style="color:var(--dim);padding:40px;text-align:center;">还没有已连接的会话 🌱<br>到「连接」页签连一台设备试试吧</div>'
    : SESSIONS.map(s => {
        const c = CONNS.find(x => x.id === s.connId);
        return `<div class="term">
          <div class="term-bar"><span class="dot"></span><span class="name">${c.label}</span><span class="target">${c.host}:${c.port}</span><button onclick="disconnect('${c.id}')">断开</button></div>
          <div class="term-body" id="body-${s.id}">${s.lines.map(l => `<div class="${l.cls || ''}">${esc(l.text)}</div>`).join('')}</div>
          <div class="term-input"><span>${c.proto === 'ssh' ? '$' : '>'}</span><input id="in-${s.id}" placeholder="输入命令…" onkeydown="if(event.key==='Enter'){sendCmd('${s.id}',this.value);this.value=''}"/></div>
        </div>`;
      }).join('');
  SESSIONS.forEach(s => { const el = $('body-' + s.id); if (el) el.scrollTop = el.scrollHeight; });
  renderChips();
}
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sendCmd(sid, cmd) {
  if (!cmd.trim()) return;
  const s = SESSIONS.find(x => x.id === sid);
  const c = CONNS.find(x => x.id === s.connId);
  pushLine(s, promptOf(c) + cmd, 'cmd');
  stream(s, c, FAKE_OUTPUT(cmd));
}
function stream(s, c, lines) {
  let i = 0;
  const timer = setInterval(() => {
    if (i >= lines.length) { clearInterval(timer); pushLine(s, promptOf(c), 'sys'); renderTerms(); return; }
    pushLine(s, lines[i++]); renderTerms();
  }, 160);
}
function renderChips() {
  $('chips').innerHTML = `<span class="chip on" data-id="*">全部</span>` + SESSIONS.map(s => {
    const c = CONNS.find(x => x.id === s.connId);
    return `<span class="chip on" data-id="${s.id}">${c.label}</span>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    if (ch.dataset.id === '*') { document.querySelectorAll('.chip').forEach(x => x.classList.add('on')); return; }
    ch.classList.toggle('on');
  });
}
function broadcast() {
  const cmd = $('bcInput').value.trim(); if (!cmd) return;
  $('bcInput').value = '';
  const all = document.querySelector('.chip[data-id="*"]').classList.contains('on');
  SESSIONS.forEach(s => {
    if (!all && !document.querySelector(`.chip[data-id="${s.id}"]`)?.classList.contains('on')) return;
    const c = CONNS.find(x => x.id === s.connId);
    pushLine(s, promptOf(c) + cmd + '   [广播]', 'cmd');
    stream(s, c, FAKE_OUTPUT(cmd));
  });
}
function switchToTerms() { document.querySelector('.tab[data-page="terms"]').click(); }

renderConns(); renderTerms();
</script>
</body>
</html>
