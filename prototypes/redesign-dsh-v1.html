<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重新设计 · DSH 仿真版 v1（三块：连接管理 | iTerm2 分屏终端 | 原生聊天）</title>
<style>
  /* ── DSH 真实设计令牌（节选自 packages/client/ui-theme/src/styles/design-platform.css） ── */
  :root {
    --dsw-font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;
    --dsw-font-code:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,Courier,'PingFang SC','Microsoft YaHei';
    --ds-ease-in-out:cubic-bezier(.4,0,.2,1); --ds-dur:.2s;
    /* 静态色（浅） */
    --dsw-static-neutral-bluish-00:rgb(255,255,255); --dsw-static-neutral-bluish-50:rgb(249,250,251);
    --dsw-static-neutral-bluish-60:rgb(245,246,247); --dsw-static-neutral-bluish-75:rgb(241,243,245);
    --dsw-static-neutral-bluish-100:rgb(235,238,242); --dsw-static-neutral-bluish-200:rgb(225,229,238);
    --dsw-static-neutral-bluish-300:rgb(207,211,214); --dsw-static-neutral-bluish-400:rgb(173,178,184);
    --dsw-static-neutral-bluish-500:rgb(151,157,166); --dsw-static-neutral-bluish-600:rgb(129,133,140);
    --dsw-static-neutral-bluish-700:rgb(97,102,107); --dsw-static-neutral-bluish-750:rgb(67,69,74);
    --dsw-static-neutral-bluish-800:rgb(53,54,56); --dsw-static-neutral-bluish-850:rgb(44,44,46);
    --dsw-static-neutral-bluish-875:rgb(35,35,36); --dsw-static-neutral-bluish-900:rgb(27,27,28);
    --dsw-static-neutral-bluish-950:rgb(21,21,23); --dsw-static-neutral-bluish-1000:rgb(15,17,21);
    --dsw-static-deepseek-50:rgb(237,243,254); --dsw-static-deepseek-100:rgb(228,237,253);
    --dsw-static-deepseek-200:rgb(211,226,255); --dsw-static-deepseek-300:rgb(183,200,254);
    --dsw-static-deepseek-400:rgb(103,158,254); --dsw-static-deepseek-450:rgb(86,134,254);
    --dsw-static-deepseek-500:rgb(65,118,230); --dsw-static-deepseek-600:rgb(72,104,178);
    --dsw-static-deepseek-800:rgb(52,65,91); --dsw-static-deepseek-900:rgb(40,49,66);
    --dsw-static-green-400:rgb(78,209,126); --dsw-static-green-500:rgb(34,197,94); --dsw-static-green-100:rgb(230,250,237);
    --dsw-static-red-400:rgb(242,90,90); --dsw-static-red-500:rgb(239,68,68); --dsw-static-red-600:rgb(236,19,19); --dsw-static-red-100:rgb(254,226,226);
    --dsw-static-amber-400:rgb(247,173,49); --dsw-static-amber-500:rgb(245,158,11); --dsw-static-amber-600:rgb(221,134,41); --dsw-static-amber-100:rgb(254,245,231);
    /* 语义别名（浅） */
    --dsw-alias-bg-base:var(--dsw-static-neutral-bluish-00);
    --dsw-alias-bg-layer-2:var(--dsw-static-neutral-bluish-00);
    --dsw-alias-bg-module-platform:var(--dsw-static-neutral-bluish-60);
    --dsw-specific-sidebar-fill:var(--dsw-static-neutral-bluish-50);
    --dsw-specific-input-major:var(--dsw-static-neutral-bluish-00);
    --dsw-specific-selector:var(--dsw-static-neutral-bluish-60);
    --dsw-specific-bubble:var(--dsw-static-deepseek-50);
    --dsw-specific-bubble-highlight:var(--dsw-static-deepseek-200);
    --dsw-alias-bg-mask-1:rgba(0,0,0,.24);
    --dsw-alias-border-l2-darkmode-thin:rgba(0,0,0,.1);
    --dsw-alias-border-l2:rgba(0,0,0,.1);
    --dsw-alias-border-l3:rgba(0,0,0,.12);
    --dsw-alias-border-l4:rgba(0,0,0,.16);
    --dsw-alias-label-primary:var(--dsw-static-neutral-bluish-1000);
    --dsw-alias-label-secondary:var(--dsw-static-neutral-bluish-700);
    --dsw-alias-label-tertiary:var(--dsw-static-neutral-bluish-600);
    --dsw-alias-label-caption:var(--dsw-static-neutral-bluish-400);
    --dsw-alias-button-info-fill:var(--dsw-static-deepseek-500);
    --dsw-alias-button-info-hover:var(--dsw-static-deepseek-400);
    --dsw-alias-interactive-bg-hover:rgba(38,49,72,.06);
    --dsw-alias-interactive-bg-hover-solid:var(--dsw-static-neutral-bluish-75);
    --dsw-alias-interactive-bg-hover-accent:rgba(38,49,72,.14);
    --dsw-alias-interactive-bg-active:rgba(38,49,72,.1);
    --dsw-alias-state-business-primary:var(--dsw-static-deepseek-500);
    --dsw-alias-state-business-tertiary:var(--dsw-static-deepseek-100);
    --dsw-alias-state-success-primary:var(--dsw-static-green-500);
    --dsw-alias-state-success-secondary:var(--dsw-static-green-400);
    --dsw-alias-state-success-tertiary:var(--dsw-static-green-100);
    --dsw-alias-state-error-primary:var(--dsw-static-red-600);
    --dsw-alias-state-error-secondary:var(--dsw-static-red-400);
    --dsw-alias-state-warn-primary:var(--dsw-static-amber-500);
    --dsw-alias-state-warn-label:var(--dsw-static-amber-600);
    --dsw-shadow-lv2:0 4px 16px rgba(0,0,0,.06);
  }
  body[data-ds-dark-theme] {
    --dsw-static-neutral-bluish-00:rgb(255,255,255); --dsw-static-neutral-bluish-50:rgb(249,250,251);
    --dsw-static-neutral-bluish-60:rgb(249,250,251); --dsw-static-neutral-bluish-75:rgb(241,243,245);
    --dsw-static-neutral-bluish-100:rgb(235,238,242); --dsw-static-neutral-bluish-200:rgb(225,229,238);
    --dsw-static-neutral-bluish-300:rgb(207,211,214); --dsw-static-neutral-bluish-400:rgb(173,178,184);
    --dsw-static-neutral-bluish-500:rgb(151,157,166); --dsw-static-neutral-bluish-600:rgb(129,133,140);
    --dsw-static-neutral-bluish-700:rgb(97,102,107); --dsw-static-neutral-bluish-750:rgb(67,69,74);
    --dsw-static-neutral-bluish-800:rgb(53,54,56); --dsw-static-neutral-bluish-850:rgb(44,44,46);
    --dsw-static-neutral-bluish-875:rgb(35,35,36); --dsw-static-neutral-bluish-900:rgb(27,27,28);
    --dsw-static-neutral-bluish-950:rgb(21,21,23); --dsw-static-neutral-bluish-1000:rgb(15,17,21);
    --dsw-alias-bg-base:var(--dsw-static-neutral-bluish-950);
    --dsw-alias-bg-layer-2:var(--dsw-static-neutral-bluish-850);
    --dsw-alias-bg-module-platform:var(--dsw-static-neutral-bluish-800);
    --dsw-specific-sidebar-fill:var(--dsw-static-neutral-bluish-900);
    --dsw-specific-input-major:var(--dsw-static-neutral-bluish-850);
    --dsw-specific-selector:var(--dsw-static-neutral-bluish-800);
    --dsw-specific-bubble:var(--dsw-static-neutral-bluish-850);
    --dsw-specific-bubble-highlight:var(--dsw-static-neutral-bluish-750);
    --dsw-alias-bg-mask-1:rgba(0,0,0,.5);
    --dsw-alias-border-l2-darkmode-thin:rgba(255,255,255,.06);
    --dsw-alias-border-l2:rgba(255,255,255,.12);
    --dsw-alias-border-l3:rgba(255,255,255,.16);
    --dsw-alias-border-l4:rgba(255,255,255,.2);
    --dsw-alias-label-primary:var(--dsw-static-neutral-bluish-50);
    --dsw-alias-label-secondary:var(--dsw-static-neutral-bluish-300);
    --dsw-alias-label-tertiary:var(--dsw-static-neutral-bluish-400);
    --dsw-alias-label-caption:var(--dsw-static-neutral-bluish-600);
    --dsw-alias-button-info-fill:var(--dsw-static-deepseek-400);
    --dsw-alias-button-info-hover:var(--dsw-static-deepseek-500);
    --dsw-alias-interactive-bg-hover:rgba(255,255,255,.08);
    --dsw-alias-interactive-bg-hover-solid:var(--dsw-static-neutral-bluish-800);
    --dsw-alias-interactive-bg-hover-accent:rgba(255,255,255,.24);
    --dsw-alias-interactive-bg-active:rgba(255,255,255,.14);
    --dsw-alias-state-business-primary:var(--dsw-static-deepseek-400);
    --dsw-alias-state-business-tertiary:var(--dsw-static-deepseek-800);
    --dsw-alias-state-success-primary:var(--dsw-static-green-500);
    --dsw-alias-state-success-secondary:var(--dsw-static-green-400);
    --dsw-alias-state-error-primary:var(--dsw-static-red-400);
    --dsw-alias-state-error-secondary:var(--dsw-static-red-400);
    --dsw-alias-state-warn-primary:var(--dsw-static-amber-500);
    --dsw-alias-state-warn-label:var(--dsw-static-amber-600);
    --dsw-shadow-lv2:0 4px 16px rgba(0,0,0,.4);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dsw-alias-bg-base); color:var(--dsw-alias-label-primary); font-family:var(--dsw-font-family); font-size:13px; line-height:1.5; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .app { display:flex; height:100vh; }

  /* ── DSH 侧边栏（原有，不改动） ── */
  .sidebar { flex:0 0 264px; background:var(--dsw-specific-sidebar-fill); border-right:1px solid var(--dsw-alias-border-l2); display:flex; flex-direction:column; min-height:0; }
  .side-head { padding:14px 16px 10px; display:flex; align-items:center; gap:8px; }
  .side-head .dot { width:9px; height:9px; border-radius:50%; background:var(--dsw-alias-state-success-primary); }
  .side-head .t { font-size:13px; font-weight:600; }
  .side-new { margin:0 12px 8px; padding:8px 12px; border:1px solid var(--dsw-alias-border-l3); border-radius:10px; color:var(--dsw-alias-label-secondary); font-size:12.5px; cursor:pointer; background:var(--dsw-alias-bg-base); }
  .side-new:hover { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); }
  .side-nav { padding:4px 8px; }
  .side-item { display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:8px; color:var(--dsw-alias-label-secondary); font-size:13px; cursor:pointer; }
  .side-item:hover { background:var(--dsw-alias-interactive-bg-hover); color:var(--dsw-alias-label-primary); }
  .side-item.active { background:var(--dsw-alias-interactive-bg-hover-accent); color:var(--dsw-alias-label-primary); font-weight:600; }
  .side-item .badge { margin-left:auto; font-size:11px; color:var(--dsw-alias-label-tertiary); }
  .side-sp { flex:1; }
  .side-theme { margin:10px; padding:8px 12px; border:1px solid var(--dsw-alias-border-l2); border-radius:10px; font-size:12px; color:var(--dsw-alias-label-secondary); cursor:pointer; text-align:center; background:var(--dsw-alias-bg-base); }
  .side-theme:hover { color:var(--dsw-alias-state-business-primary); border-color:var(--dsw-alias-state-business-primary); }

  /* ── 插件主区：三块 ── */
  .plug { flex:1; display:flex; min-width:0; background:var(--dsw-alias-bg-base); }

  /* 左：连接管理 */
  .colc { flex:0 0 300px; border-right:1px solid var(--dsw-alias-border-l2); display:flex; flex-direction:column; min-height:0; background:var(--dsw-alias-bg-base); }
  .col-head { padding:12px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--dsw-alias-border-l2); }
  .col-head .sp { flex:1; }
  .btn { border:1px solid var(--dsw-alias-border-l2); background:var(--dsw-alias-bg-base); color:var(--dsw-alias-label-secondary); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:500; cursor:pointer; font-family:var(--dsw-font-family); }
  .btn:hover { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); }
  .btn.primary { background:var(--dsw-alias-button-info-fill); border-color:transparent; color:#fff; }
  .btn.primary:hover { background:var(--dsw-alias-button-info-hover); color:#fff; }
  .btn.danger:hover { border-color:var(--dsw-alias-state-error-primary); color:var(--dsw-alias-state-error-primary); }
  .flt { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--dsw-alias-border-l2); }
  .fchip { font-size:12px; padding:3px 11px; border:1px solid var(--dsw-alias-border-l2); border-radius:999px; color:var(--dsw-alias-label-secondary); cursor:pointer; user-select:none; }
  .fchip:hover { border-color:var(--dsw-alias-interactive-bg-hover-accent); color:var(--dsw-alias-label-primary); }
  .fchip.on { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); background:var(--dsw-alias-state-business-tertiary); }
  .col-scroll { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .sec-label { font-size:11px; color:var(--dsw-alias-label-tertiary); font-weight:600; margin:4px 2px 2px; }
  .conn { border:1px solid var(--dsw-alias-border-l2); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; gap:7px; }
  .conn:hover { border-color:var(--dsw-alias-border-l3); }
  .conn .r1 { display:flex; align-items:center; gap:7px; }
  .proto { font-size:10px; font-weight:600; padding:1px 7px; border-radius:6px; font-family:var(--dsw-font-code); }
  .proto.ssh { background:var(--dsw-alias-state-business-tertiary); color:var(--dsw-alias-state-business-primary); }
  .proto.telnet { background:var(--dsw-alias-state-warn-primary); color:var(--dsw-static-neutral-bluish-00); opacity:.85; }
  .conn .nm { font-weight:600; font-size:13px; }
  .conn .st { font-size:11px; padding:2px 8px; border-radius:999px; margin-left:auto; font-weight:500; white-space:nowrap; }
  .st.off { color:var(--dsw-alias-label-tertiary); background:var(--dsw-alias-interactive-bg-hover); }
  .st.connecting { color:var(--dsw-alias-state-warn-label); background:var(--dsw-alias-state-warn-primary); opacity:.9; color:var(--dsw-static-neutral-bluish-00); }
  .st.on { color:var(--dsw-alias-state-success-primary); background:var(--dsw-alias-state-success-tertiary); }
  .conn .addr { font-family:var(--dsw-font-code); font-size:11.5px; color:var(--dsw-alias-label-tertiary); }
  .conn .acts { display:flex; gap:6px; margin-top:2px; }
  .sess { display:flex; align-items:center; gap:8px; border:1px solid var(--dsw-alias-border-l2); border-radius:9px; padding:7px 10px; font-size:12.5px; cursor:pointer; user-select:none; }
  .sess:hover { border-color:var(--dsw-alias-border-l3); }
  .sess.hid { opacity:.5; border-style:dashed; }
  .sess .led { width:8px; height:8px; border-radius:50%; background:var(--dsw-alias-state-success-primary); box-shadow:0 0 4px var(--dsw-alias-state-success-primary); }
  .sess .nm2 { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .x { background:none; border:none; color:var(--dsw-alias-label-tertiary); cursor:pointer; font-size:13px; padding:0 2px; }
  .sess .x:hover { color:var(--dsw-alias-state-error-primary); }
  .empty { color:var(--dsw-alias-label-tertiary); padding:14px; text-align:center; font-size:12.5px; }

  /* 中：终端（iTerm2 分屏） */
  .colt { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--dsw-alias-bg-base); border-right:1px solid var(--dsw-alias-border-l2); }
  .term-top { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--dsw-alias-border-l2); }
  .term-top .onb { font-size:12px; color:var(--dsw-alias-label-tertiary); }
  .term-top .onb b { color:var(--dsw-alias-state-success-primary); }
  .term-top .sp { flex:1; }
  .switch { font-size:12px; border:1px solid var(--dsw-alias-border-l2); border-radius:8px; padding:3px 10px; color:var(--dsw-alias-label-secondary); cursor:pointer; user-select:none; }
  .switch:hover { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); }
  .switch.on { color:var(--dsw-alias-state-business-primary); border-color:var(--dsw-alias-state-business-primary); background:var(--dsw-alias-state-business-tertiary); }

  /* 分屏窗格：多窗格网格 + 聚焦高亮 + 可最大化（iTerm2） */
  .splitwrap { flex:1; overflow:auto; padding:10px; }
  .split { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); grid-auto-rows:minmax(150px,1fr); gap:8px; align-content:start; }
  .split.maximized .pane { display:none; }
  .split.maximized .pane.focus { display:flex; }
  .split .pane.focus { outline:2px solid var(--dsw-alias-state-business-primary); outline-offset:-1px; }
  .pane { background:var(--term-bg); border:1px solid var(--dsw-alias-border-l2); border-radius:9px; display:flex; flex-direction:column; overflow:hidden; min-height:150px; }
  :root { --term-bg:#0c0f14; --term-text:#e6e9ef; --term-dim:#6f7683; --term-cmd:#7aa2f7; --term-green:#9ece6a; }
  .pane-bar { display:flex; align-items:center; gap:7px; padding:5px 9px; background:var(--dsw-alias-bg-layer-2); border-bottom:1px solid var(--dsw-alias-border-l2); font-size:12px; flex-shrink:0; }
  .pane-bar .dot { width:8px; height:8px; border-radius:50%; background:var(--dsw-alias-state-success-primary); }
  .pane-bar .nm3 { font-weight:600; font-family:var(--dsw-font-code); }
  .pane-bar .tgt { color:var(--dsw-alias-label-tertiary); font-family:var(--dsw-font-code); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane-bar button { margin-left:auto; background:none; border:none; color:var(--dsw-alias-label-tertiary); cursor:pointer; font-size:13px; padding:0 2px; }
  .pane-bar button:hover { color:var(--dsw-alias-state-business-primary); }
  .pane-body { flex:1; overflow-y:auto; padding:7px 10px; background:var(--term-bg); color:var(--term-text); font:12px/1.55 var(--dsw-font-code); white-space:pre-wrap; word-break:break-all; }
  .pane-body .cmd { color:var(--term-cmd); }
  .pane-body .sys { color:var(--term-dim); }
  .pane-input { display:flex; align-items:center; border-top:1px solid var(--dsw-alias-border-l2); padding:0 10px; background:var(--dsw-alias-bg-layer-2); }
  .pane-input span { color:var(--term-green); font-weight:600; font-family:var(--dsw-font-code); }
  .pane-input input { flex:1; background:transparent; border:none; outline:none; color:var(--dsw-alias-label-primary); font:12px var(--dsw-font-code); padding:6px 8px; }

  /* 广播条 */
  .bcast { display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--dsw-alias-border-l2); }
  .bcast .lb { font-size:12px; color:var(--dsw-alias-label-secondary); font-weight:600; white-space:nowrap; }
  .bchips { display:flex; gap:4px; flex-wrap:wrap; }
  .bchip { font-size:11.5px; padding:2px 9px; border:1px solid var(--dsw-alias-border-l2); border-radius:999px; cursor:pointer; color:var(--dsw-alias-label-tertiary); user-select:none; white-space:nowrap; }
  .bchip.on { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); background:var(--dsw-alias-state-business-tertiary); }
  .bcast input { flex:1; min-width:70px; background:var(--dsw-alias-bg-module-platform); border:1px solid var(--dsw-alias-border-l2); border-radius:8px; color:var(--dsw-alias-label-primary); padding:5px 10px; font:12px var(--dsw-font-code); outline:none; }
  .bcast input:focus { border-color:var(--dsw-alias-state-business-primary); }

  /* 右：AI 聊天（嵌 DSH 原生聊天：气泡 + 胶囊输入） */
  .cola { flex:0 0 360px; display:flex; flex-direction:column; min-height:0; background:var(--dsw-alias-bg-base); }
  .ai-head { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--dsw-alias-border-l2); }
  .ai-head .t { font-size:13px; font-weight:600; }
  .ai-head .run { font-size:11px; color:var(--dsw-alias-state-success-primary); margin-left:2px; }
  .ai-head .sp { flex:1; }
  .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:86%; padding:9px 13px; border-radius:14px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--dsw-specific-bubble-highlight); border-top-right-radius:4px; color:var(--dsw-alias-label-primary); }
  .msg.ai { align-self:flex-start; background:var(--dsw-specific-bubble); border-top-left-radius:4px; color:var(--dsw-alias-label-primary); }
  .msg .who { font-size:11px; color:var(--dsw-alias-label-tertiary); margin-bottom:3px; }
  .msg .mono { font-family:var(--dsw-font-code); color:var(--dsw-alias-state-business-primary); }
  /* 胶囊输入（DSH InputBar） */
  .compose { padding:0 16px 8px; display:flex; justify-content:center; }
  .compose .card { width:100%; max-width:520px; display:flex; flex-direction:column; gap:8px; padding:12px 14px 10px; border:1px solid var(--dsw-alias-border-l2-darkmode-thin); border-radius:22px; background:var(--dsw-specific-input-major); box-shadow:var(--dsw-shadow-lv2); }
  .compose .card .box { min-height:44px; color:var(--dsw-alias-label-caption); font-size:14px; outline:none; }
  .compose .card .row { display:flex; align-items:center; gap:8px; }
  .compose .card .row .sp { flex:1; }
  .model { font-size:11.5px; color:var(--dsw-alias-label-tertiary); }
  .send { display:grid; place-items:center; width:34px; height:34px; border:none; border-radius:999px; background:var(--dsw-alias-button-info-fill); color:#fff; cursor:pointer; }
  .send:hover { background:var(--dsw-alias-button-info-hover); }
  .send:disabled { opacity:.4; cursor:default; }
  .compose .help { font-size:11px; color:var(--dsw-alias-label-caption); text-align:center; padding-bottom:10px; }

  /* 连接表单抽屉 */
  .mask { position:fixed; inset:0; background:var(--dsw-alias-bg-mask-1); opacity:0; pointer-events:none; transition:opacity .18s; z-index:9; }
  .mask.open { opacity:1; pointer-events:auto; }
  .form { position:fixed; top:0; left:0; height:100vh; width:min(340px,90vw); background:var(--dsw-alias-bg-layer-2); border-right:1px solid var(--dsw-alias-border-l2); padding:16px; display:flex; flex-direction:column; gap:11px; transform:translateX(-100%); transition:transform .2s var(--ds-ease-in-out); z-index:10; overflow-y:auto; box-shadow:var(--dsw-shadow-lv2); }
  .form.open { transform:translateX(0); }
  .form h3 { font-size:14px; }
  .legend { font-size:11px; color:var(--dsw-alias-label-tertiary); }
  .req { color:var(--dsw-alias-state-error-primary); font-weight:600; }
  .opt-tag { font-size:10px; color:var(--dsw-alias-label-tertiary); border:1px solid var(--dsw-alias-border-l2); border-radius:6px; padding:0 5px; margin-left:4px; }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld label { font-size:11.5px; font-weight:500; color:var(--dsw-alias-label-secondary); }
  .fld input,.fld select { background:var(--dsw-alias-bg-module-platform); border:1px solid var(--dsw-alias-border-l2); border-radius:8px; color:var(--dsw-alias-label-primary); padding:7px 10px; font-size:12.5px; outline:none; width:100%; font-family:var(--dsw-font-family); }
  .fld input:focus,.fld select:focus { border-color:var(--dsw-alias-state-business-primary); }
  .fld.error input { border-color:var(--dsw-alias-state-error-primary); background:var(--dsw-alias-state-error-primary); opacity:.08; }
  .fld .hint { font-size:11px; color:var(--dsw-alias-state-error-primary); display:none; }
  .fld.error .hint { display:block; }
  .auth-switch { display:flex; gap:5px; }
  .auth-switch span { font-size:11.5px; padding:4px 12px; border:1px solid var(--dsw-alias-border-l2); border-radius:7px; cursor:pointer; color:var(--dsw-alias-label-secondary); user-select:none; }
  .auth-switch span.on { border-color:var(--dsw-alias-state-business-primary); color:var(--dsw-alias-state-business-primary); background:var(--dsw-alias-state-business-tertiary); }
  .form-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:auto; padding-top:8px; border-top:1px solid var(--dsw-alias-border-l2); }
</style>
</head>
<body>
<div class="app">
  <!-- DSH 侧边栏（原有） -->
  <aside class="sidebar">
    <div class="side-head"><span class="dot"></span><span class="t">DeepSeek Harness</span></div>
    <div class="side-new">＋ 新建会话</div>
    <div class="side-nav">
      <div class="side-item active">终端插件联调 <span class="badge">1</span></div>
      <div class="side-item">昨天的任务</div>
      <div class="side-item">代码评审</div>
      <div class="side-item">部署排查</div>
    </div>
    <div class="side-sp"></div>
    <div class="side-theme" onclick="toggleTheme()">☀ 切换到夜间</div>
  </aside>

  <!-- 插件：三块 -->
  <div class="plug">
    <!-- 左：连接管理 -->
    <div class="colc">
      <div class="col-head">📡 连接管理 <span class="sp"></span><button class="btn primary" onclick="openForm()">＋ 新建</button></div>
      <div class="flt">
        <span class="fchip on" data-f="all" onclick="setFilter('all')">全部</span>
        <span class="fchip" data-f="ssh" onclick="setFilter('ssh')">SSH</span>
        <span class="fchip" data-f="telnet" onclick="setFilter('telnet')">Telnet</span>
      </div>
      <div class="col-scroll">
        <div class="sec-label">已保存连接</div>
        <div id="connList"></div>
        <div class="sec-label">活跃会话</div>
        <div id="sessList"></div>
      </div>
    </div>

    <!-- 中：终端分屏 -->
    <div class="colt">
      <div class="term-top">
        <span class="onb">在线 <b id="onlineCount">0</b> / <span id="allCount">0</span></span>
        <span class="switch" id="viewSwitch" onclick="toggleView()">分屏</span>
        <span class="sp"></span>
      </div>
      <div class="splitwrap"><div class="split" id="split"></div></div>
      <div class="bcast">
        <span class="lb">📢 广播到</span>
        <div class="bchips" id="bchips"></div>
        <input id="bcInput" placeholder="输入命令，发给选中的会话…" />
        <button class="btn primary" id="bcSend" onclick="broadcast()">发送</button>
      </div>
    </div>

    <!-- 右：AI 聊天（DSH 原生聊天观感） -->
    <div class="cola">
      <div class="ai-head"><span class="t">💬 对话</span><span class="run">● running</span><span class="sp"></span><span style="color:var(--dsw-alias-label-tertiary);font-size:11px;">模型 dsv4-flash</span></div>
      <div class="msgs" id="aiMsgs"></div>
      <div class="compose">
        <div class="card">
          <div class="box" contenteditable="true" id="aiInput">连上 web-01 和 db-02，都跑一下 show version…</div>
          <div class="row">
            <span class="model">Plan · 只读</span><span class="sp"></span>
            <button class="send" id="aiSend" onclick="sendAi()" title="发送">➤</button>
          </div>
        </div>
      </div>
      <div class="compose"><div class="help" style="padding-bottom:4px;">Tip：让 AI 连设备、发命令、读结果，过程实时可见。</div></div>
    </div>
  </div>
</div>

<!-- 连接表单抽屉 -->
<div class="mask" id="mask" onclick="closeForm()"></div>
<div class="form" id="connForm">
  <h3 id="formTitle">新建连接</h3>
  <div class="legend"><span class="req">*</span> 必填；「选填」可留空（密码/私钥按认证方式二选一）</div>
  <div style="display:flex;gap:8px;">
    <div class="fld" id="fwLabel" style="flex:1"><label>名称 <span class="req">*</span></label><input id="fLabel" placeholder="如 web-01" /><span class="hint">请填写名称</span></div>
    <div class="fld" style="flex:0 0 84px"><label>协议 <span class="req">*</span></label><select id="fProto" onchange="onProtoChange()"><option value="ssh">SSH</option><option value="telnet">Telnet</option></select></div>
  </div>
  <div style="display:flex;gap:8px;">
    <div class="fld" id="fwHost" style="flex:1"><label>IP 地址 <span class="req">*</span></label><input id="fHost" placeholder="192.168.1.10" /><span class="hint">请填写 IP</span></div>
    <div class="fld" style="flex:0 0 84px"><label>端口 <span class="req">*</span></label><input id="fPort" placeholder="22" /><span class="hint"></span></div>
  </div>
  <div id="sshBlock">
    <div style="display:flex;gap:8px;">
      <div class="fld" id="fwUser" style="flex:1"><label>用户名 <span class="req">*</span>（SSH）</label><input id="fUser" placeholder="admin" /><span class="hint">SSH 需用户名</span></div>
      <div class="fld" style="flex:0 0 108px"><label>认证方式 <span class="req">*</span></label><div class="auth-switch"><span class="on" id="authPwd" onclick="setAuth('password')">密码</span><span id="authKey" onclick="setAuth('key')">密钥</span></div></div>
    </div>
    <div id="pwdRow"><div class="fld" id="fwPass"><label>密码 <span class="req">*</span></label><input id="fPass" type="password" placeholder="登录密码" /><span class="hint">选密码认证时必填</span></div></div>
    <div id="keyRow" style="display:none;">
      <div style="display:flex;gap:8px;">
        <div class="fld" id="fwKey" style="flex:2"><label>私钥 <span class="req">*</span></label><input id="fKey" placeholder="私钥内容或路径" /><span class="hint">选密钥认证时必填</span></div>
        <div class="fld" style="flex:1"><label>口令 <span class="opt-tag">选填</span></label><input id="fPassphrase" type="password" placeholder="口令" /></div>
      </div>
    </div>
  </div>
  <div id="telnetBlock" style="display:none;">
    <div style="display:flex;gap:8px;">
      <div class="fld" style="flex:1"><label>用户名 <span class="opt-tag">选填</span>（Telnet）</label><input id="fTUser" placeholder="需要登录时填" /></div>
      <div class="fld" style="flex:1"><label>密码 <span class="opt-tag">选填</span>（Telnet）</label><input id="fTPass" type="password" placeholder="需要登录时填" /></div>
    </div>
  </div>
  <div class="fld"><label>备注 <span class="opt-tag">选填</span></label><input id="fNote" placeholder="用途、位置等备忘" /></div>
  <div class="form-foot">
    <button class="btn" onclick="closeForm()">取消</button>
    <button class="btn primary" onclick="saveConn()">保存连接</button>
  </div>
</div>

<script>
const CONNS=[
  {id:'c1',label:'web-01',proto:'ssh',host:'10.0.1.5',port:22,user:'admin',note:'前端测试服务器',status:'off'},
  {id:'c2',label:'db-02',proto:'telnet',host:'10.0.1.8',port:23,user:'',note:'',status:'off'},
  {id:'c3',label:'cache-03',proto:'ssh',host:'10.0.1.12',port:22,user:'root',note:'缓存节点',status:'off'},
  {id:'c4',label:'sw-04',proto:'ssh',host:'10.0.1.9',port:22,user:'admin',note:'汇聚交换机',status:'off'},
  {id:'c5',label:'esl-lab7',proto:'telnet',host:'10.0.1.20',port:23,user:'',note:'ESL 环境',status:'off'},
];
const SESSIONS=[]; // {id,connId,lines,hidden}
let editing=null,seq=0,authMode='password',focusedSid=null,viewMax=false,filter='all';
const $=id=>document.getElementById(id);
const promptOf=c=>`${c.label}${c.proto==='ssh'?'$':'>'} `;
const FAKE_OUTPUT=cmd=>[`执行: ${cmd}`,'----------------------------------------','Interface      Status    Protocol','Gig0/0         up        up','Gig0/1         up        up',`完成于 ${new Date().toLocaleTimeString()}`];
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleTheme(){document.body.toggleAttribute('data-ds-dark-theme');document.querySelector('.side-theme').textContent=document.body.hasAttribute('data-ds-dark-theme')?'☀ 切换到日间':'☀ 切换到夜间';}
function setFilter(f){filter=f;document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.f===f));renderConns();}
function connect(id){const c=CONNS.find(x=>x.id===id);if(c.status!=='off')return;c.status='connecting';renderConns();renderSess();setTimeout(()=>{c.status='on';renderConns();renderSess();openSession(c);},700);}
function disconnect(cid){const c=CONNS.find(x=>x.id===cid);if(c)c.status='off';const i=SESSIONS.findIndex(s=>s.connId===cid);if(i>=0){if(SESSIONS[i].id===focusedSid)focusedSid=null;SESSIONS.splice(i,1);}renderConns();renderSess();renderTerms();}
function openSession(c){if(SESSIONS.some(s=>s.connId===c.id))return;const s={id:'s'+(++seq),connId:c.id,lines:[],hidden:false};SESSIONS.push(s);pushLine(s,`[已连接 ${c.host}:${c.port}]`,'sys');pushLine(s,c.proto==='ssh'?`Welcome to ${c.label} (SSH)`:`Connected to ${c.label}`,'sys');pushLine(s,promptOf(c),'sys');renderTerms();}

function renderConns(){
  const list=CONNS.filter(c=>filter==='all'||c.proto===filter);
  $('connList').innerHTML=list.length?list.map(c=>`
    <div class="conn">
      <div class="r1"><span class="proto ${c.proto}">${c.proto.toUpperCase()}</span><span class="nm">${c.label}</span><span class="st ${c.status}">${c.status==='on'?'● 已连接':c.status==='connecting'?'连接中…':'未连接'}</span></div>
      <div class="addr">${c.host}:${c.port}${c.user?' · '+c.user:''}${c.note?' · '+c.note:''}</div>
      <div class="acts">
        <button class="btn primary" onclick="connect('${c.id}')">${c.status==='on'?'已连接':c.status==='connecting'?'连接中…':'连接'}</button>
        <button class="btn" onclick="editConn('${c.id}')">编辑</button>
        <button class="btn danger" onclick="delConn('${c.id}')">删除</button>
      </div>
    </div>`).join(''):'<div class="empty">无符合条件的连接</div>';
}
function renderSess(){
  $('sessList').innerHTML=SESSIONS.length?SESSIONS.map(s=>{
    const c=CONNS.find(x=>x.id===s.connId);
    return `<div class="sess ${s.hidden?'hid':''}" onclick="toggleHide('${c.id}')" title="点我显示/隐藏（不断开）">
      <span class="led"></span><span class="nm2">${c.label}</span>
      <button class="x" onclick="event.stopPropagation();disconnect('${c.id}')" title="断开">✕</button>
    </div>`;
  }).join(''):'<div class="empty">暂无活跃会话</div>';
}
function toggleHide(cid){const s=SESSIONS.find(x=>x.connId===cid);if(!s)return;s.hidden=!s.hidden;if(s.hidden&&focusedSid===s.id)focusedSid=null;renderSess();renderTerms();}

function pushLine(s,text,cls){s.lines.push({text,cls});if(s.lines.length>400)s.lines.shift();}
function renderTerms(){
  $('onlineCount').textContent=CONNS.filter(c=>c.status==='on').length;
  $('allCount').textContent=CONNS.length;
  $('viewSwitch').textContent=viewMax?'聚焦':'分屏';
  const vis=SESSIONS.filter(s=>!s.hidden);
  $('split').innerHTML=SESSIONS.length===0
    ?'<div class="empty" style="grid-column:1/-1;">还没有已连接的会话 🌱<br>在左侧「连接管理」连一台设备</div>'
    :vis.length===0
    ?'<div class="empty" style="grid-column:1/-1;">所有终端已隐藏 —— 点左侧「活跃会话」恢复<br>（连接保持）</div>'
    :vis.map(s=>{const c=CONNS.find(x=>x.id===s.connId);return `<div class="pane ${focusedSid===s.id?'focus':''}" data-sid="${s.id}">
      <div class="pane-bar"><span class="dot"></span><span class="nm3">${c.label}</span><span class="tgt">${c.host}:${c.port}</span><button onclick="focusPane('${s.id}')" title="聚焦/最大化">⛶</button><button onclick="disconnect('${c.id}')" title="断开">✕</button></div>
      <div class="pane-body" id="body-${s.id}">${s.lines.map(l=>`<div class="${l.cls||''}">${esc(l.text)}</div>`).join('')}</div>
      <div class="pane-input"><span>${c.proto==='ssh'?'$':'>'}</span><input placeholder="输入命令…" onkeydown="if(event.key==='Enter'){sendCmd('${s.id}',this.value);this.value=''}"/></div>
    </div>`;}).join('');
  const sp=$('split');sp.classList.toggle('maximized',viewMax);
  SESSIONS.forEach(s=>{const el=$('body-'+s.id);if(el)el.scrollTop=el.scrollHeight;});
  renderBchips();
}
function focusPane(sid){focusedSid=focusedSid===sid?null:sid;if(focusedSid)viewMax=true;else viewMax=false;renderTerms();}
function toggleView(){viewMax=!viewMax;if(viewMax&&!focusedSid&&SESSIONS.length)focusedSid=SESSIONS[0].id;renderTerms();}
function sendCmd(sid,cmd){if(!cmd.trim())return;const s=SESSIONS.find(x=>x.id===sid);const c=CONNS.find(x=>x.id===s.connId);pushLine(s,promptOf(c)+cmd,'cmd');stream(s,c,FAKE_OUTPUT(cmd));}
function stream(s,c,lines){let i=0;const t=setInterval(()=>{if(i>=lines.length){clearInterval(t);pushLine(s,promptOf(c),'sys');renderTerms();return;}pushLine(s,lines[i++]);renderTerms();},160);}

function renderBchips(){const avail=SESSIONS.filter(s=>!s.hidden);$('bchips').innerHTML=`<span class="bchip on" data-id="*" onclick="chipAll()">全部</span>`+avail.map(s=>{const c=CONNS.find(x=>x.id===s.connId);return `<span class="bchip on" data-id="${s.id}" onclick="chipToggle(this)">${c.label}</span>`;}).join('');updateBcCount();}
function chipToggle(el){el.classList.toggle('on');syncAll();updateBcCount();}
function chipAll(){const ind=[...document.querySelectorAll('.bchip:not([data-id="*"])')];const allOn=ind.length>0&&ind.every(c=>c.classList.contains('on'));ind.forEach(c=>c.classList.toggle('on',!allOn));document.querySelector('.bchip[data-id="*"]').classList.toggle('on',!allOn);updateBcCount();}
function syncAll(){const ind=[...document.querySelectorAll('.bchip:not([data-id="*"])')];document.querySelector('.bchip[data-id="*"]').classList.toggle('on',ind.length>0&&ind.every(c=>c.classList.contains('on')));}
function selTargets(){return [...document.querySelectorAll('.bchip.on:not([data-id="*"])')].map(c=>c.dataset.id);}
function updateBcCount(){const n=selTargets().length;$('bcSend').textContent=n>0?`发送（${n}）`:'发送';}
function broadcast(){const cmd=$('bcInput').value.trim();if(!cmd)return;const tg=selTargets();if(!tg.length)return;$('bcInput').value='';tg.forEach(sid=>{if(SESSIONS.some(s=>s.id===sid))sendCmd(sid,cmd);});}

function appendMsg(who,html){const d=document.createElement('div');d.className='msg '+(who==='user'?'user':'ai');d.innerHTML=`<div class="who">${who==='user'?'你':'AI'}</div>${html}`;$('aiMsgs').appendChild(d);$('aiMsgs').scrollTop=$('aiMsgs').scrollHeight;}
function sendAi(){const t=$('aiInput').textContent.trim();if(!t)return;appendMsg('user',esc(t));$('aiInput').textContent='';setTimeout(()=>{appendMsg('ai','收到。正在通过终端管理连接设备……<div class="mono">tm_connect 10.0.1.5</div>两台都已完成：<div class="mono">web-01 → 版本 17.3.4<br>db-02 → 版本 15.1(2)</div>无异常。');},500);}

function openForm(){editing=null;$('formTitle').textContent='新建连接';clearForm();$('mask').classList.add('open');$('connForm').classList.add('open');}
function closeForm(){$('mask').classList.remove('open');$('connForm').classList.remove('open');}
function clearForm(){['fLabel','fHost','fPort','fUser','fPass','fKey','fPassphrase','fTUser','fTPass','fNote'].forEach(id=>$(id).value='');$('fProto').value='ssh';authMode='password';onProtoChange();clearErrors();}
function clearErrors(){document.querySelectorAll('.fld.error').forEach(f=>f.classList.remove('error'));}
function onProtoChange(){const ssh=$('fProto').value==='ssh';$('sshBlock').style.display=ssh?'block':'none';$('pwdRow').style.display=ssh&&authMode==='password'?'block':'none';$('keyRow').style.display=ssh&&authMode==='key'?'block':'none';$('telnetBlock').style.display=ssh?'none':'block';$('fPort').placeholder=ssh?'22':'23';clearErrors();}
function setAuth(m){authMode=m;$('authPwd').classList.toggle('on',m==='password');$('authKey').classList.toggle('on',m==='key');$('pwdRow').style.display=m==='password'?'block':'none';$('keyRow').style.display=m==='key'?'block':'none';clearErrors();}
function markError(id){$(id).classList.add('error');}
function saveConn(){clearErrors();const ssh=$('fProto').value==='ssh';let bad=false;
  if(!$('fLabel').value.trim()){markError('fwLabel');bad=true;}
  if(!$('fHost').value.trim()){markError('fwHost');bad=true;}
  if(ssh){if(!$('fUser').value.trim()){markError('fwUser');bad=true;}if(authMode==='password'&&!$('fPass').value){markError('fwPass');bad=true;}if(authMode==='key'&&!$('fKey').value.trim()){markError('fwKey');bad=true;}}
  if(bad)return;
  const data={label:$('fLabel').value.trim(),proto:$('fProto').value,host:$('fHost').value.trim(),port:+$('fPort').value||(ssh?22:23),user:ssh?$('fUser').value.trim():$('fTUser').value.trim(),note:$('fNote').value.trim(),status:'off'};
  if(editing)Object.assign(CONNS.find(x=>x.id===editing),data);else CONNS.push({id:'c'+Date.now(),...data});
  closeForm();renderConns();
}
function editConn(id){const c=CONNS.find(x=>x.id===id);editing=id;$('formTitle').textContent='编辑连接：'+c.label;clearForm();$('fLabel').value=c.label;$('fProto').value=c.proto;$('fHost').value=c.host;$('fPort').value=c.port;$('fNote').value=c.note??'';onProtoChange();if(c.proto==='ssh'){$('fUser').value=c.user??'';}else{$('fTUser').value=c.user??'';}$('mask').classList.add('open');$('connForm').classList.add('open');}
function delConn(id){disconnect(id);const i=CONNS.findIndex(x=>x.id===id);if(i>=0)CONNS.splice(i,1);renderConns();}

appendMsg('ai','你好，我是终端助手。我可以连设备、发命令、读结果，并把过程实时给你看。');
renderConns();renderSess();renderTerms();
</script>
</body>
</html>
