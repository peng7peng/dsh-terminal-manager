# DSH 终端管理插件 —— E2E 自动化测试
#
# 触发：PR 打到 main；push v* 标签。
# 运行：run-e2e.mjs 一键编排（自动拉起 mock 设备 + DSH tm-ci 服务 + 24 场景 + 结果落盘 + 进程清理）。
#
# 关键点：
#  - deepseek-harness 检出为兄弟目录（../deepseek-harness），与本地开发布局一致，
#  - dsh-terminal-manager 的 devDependencies 用 `link:` 指向它。
#  - dsh CLI 用仓库内的 `node --import tsx/esm apps/cli/src/bin.ts`（tsx 随 install 装好）。
#  - run-e2e.mjs 自动管理进程生命周期，workflow 只需安装、初始化 profile、跑脚本。

name: smoke

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出 dsh-terminal-manager
        uses: actions/checkout@v4

      - name: 检出 deepseek-harness（兄弟目录）
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: ../deepseek-harness

      - name: 安装 Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 安装 deepseek-harness 依赖
        working-directory: ../deepseek-harness
        run: pnpm install

      - name: 安装并构建 dsh-terminal-manager
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pnpm install
          pnpm build

      - name: 初始化 tm-ci profile（dsh plugin add + 固化 bundles）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # ── 1) 确认 dsh CLI 可用 ──
          if [ -x "$GITHUB_WORKSPACE/../deepseek-harness/node_modules/.bin/tsx" ]; then
            run_dsh() {
              ( cd "$GITHUB_WORKSPACE/../deepseek-harness" && node --import tsx/esm apps/cli/src/bin.ts "$@" )
            }
          else
            run_dsh() { npx --yes @deepseek-ai/dsh "$@"; }
          fi
          run_dsh --version

          # ── 2) 初始化 tm-ci profile + link 安装本插件 ──
          run_dsh plugin --profile tm-ci add "dsh-terminal-manager@link:$GITHUB_WORKSPACE"

          # ── 3) 把 profile 的 bundles 固化为冒烟三件套 ──
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const os = require("node:os");
            const home = (process.env.DSH_HOME && process.env.DSH_HOME.trim()) || path.join(os.homedir(), ".dsh");
            const p = path.join(home, "profiles", "tm-ci", "package.json");
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.dsh = m.dsh ?? {};
            m.dsh.profile = m.dsh.profile ?? {};
            m.dsh.profile.bundles = ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-terminal-manager"];
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
            console.log("[e2e] tm-ci bundles =>", JSON.stringify(m.dsh.profile.bundles));
          '

      - name: 跑 E2E 自动化测试（24 场景）
        working-directory: ${{ github.workspace }}
        env:
          DSH_PORT: '3180'
          DSH_PROFILE: 'tm-ci'
          SKIP_BUILD: '1'
        run: node scripts/run-e2e.mjs

      - name: 上传 E2E 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ../.codeartswork/tests/dsh-terminal-manager/e2e-results.json
