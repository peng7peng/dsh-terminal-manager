<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 A — 深色紧凑（运维风）</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #2d333b;
    --text: #c9d1d9; --dim: #768390; --accent: #3fb950; --accent2: #58a6ff;
    --warn: #d29922; --err: #f85149; --term-bg: #010409;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; font-weight: 600; }
  header .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; }
  .tabs { display: flex; gap: 2px; margin-left: 20px; }
  .tab { padding: 5px 16px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; font-size: 13px; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent2); }
  .tab .badge { background: var(--accent); color: #04120a; border-radius: 8px; font-size: 10px; padding: 0 5px; margin-left: 4px; font-weight: 700; }
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .page { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .page.active { display: flex; }

  /* ── 终端页 ── */
  .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 8px; padding: 8px; overflow: auto; }
  .term { background: var(--term-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; min-height: 220px; overflow: hidden; }
  .term-bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--panel2); border-bottom: 1px solid var(--border); font-size: 12px; }
  .term-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .term-bar .name { font-family: Consolas, monospace; }
  .term-bar .target { color: var(--dim); font-family: Consolas, monospace; font-size: 11px; }
  .term-bar button { margin-left: auto; }
  .term-body { flex: 1; overflow-y: auto; padding: 6px 10px; font: 12px/1.45 Consolas, "Courier New", monospace; color: #b8f0c0; white-space: pre-wrap; word-break: break-all; }
  .term-body .cmd { color: var(--accent2); }
  .term-body .sys { color: var(--dim); }
  .term-input { display: flex; border-top: 1px solid var(--border); }
  .term-input span { padding: 4px 0 4px 10px; color: var(--accent); font-family: Consolas, monospace; }
  .term-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font: 12px Consolas, monospace; padding: 4px 8px; }

  /* ── 广播栏 ── */
  .broadcast { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border); }
  .broadcast label { color: var(--dim); font-size: 12px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; color: var(--dim); user-select: none; font-family: Consolas, monospace; }
  .chip.on { border-color: var(--accent2); color: var(--accent2); background: #58a6ff14; }
  .broadcast input { flex: 1; background: var(--term-bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 5px 10px; font: 12px Consolas, monospace; outline: none; }
  .broadcast input:focus { border-color: var(--accent2); }

  /* ── 连接页 ── */
  .conn-list { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .conn { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .conn .proto { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; font-family: Consolas, monospace; }
  .proto.ssh { background: #1f6feb33; color: var(--accent2); }
  .proto.telnet { background: #d2992233; color: var(--warn); }
  .conn .label { font-weight: 600; min-width: 90px; }
  .conn .addr { color: var(--dim); font-family: Consolas, monospace; font-size: 12px; flex: 1; }
  .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
  .status.off { color: var(--dim); border-color: var(--border); }
  .status.connecting { color: var(--warn); border-color: var(--warn); }
  .status.on { color: var(--accent); border-color: var(--accent); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 12px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent2); color: var(--accent2); }
  button.primary { background: #1f6feb22; border-color: var(--accent2); color: var(--accent2); }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .conn-form { background: var(--panel); border: 1px solid var(--accent2); border-radius: 6px; padding: 12px; display: none; flex-direction: column; gap: 8px; }
  .conn-form.open { display: flex; }
  .conn-form .row { display: flex; gap: 8px; }
  .conn-form input, .conn-form select { background: var(--term-bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 5px 10px; font-size: 12px; outline: none; flex: 1; }
  .conn-form input:focus { border-color: var(--accent2); }
  .foot { padding: 6px 14px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--border); background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>终端管理</h1><span class="tag">原型 A · 深色紧凑</span>
  <div class="tabs">
    <div class="tab active" data-page="terms">终端 <span class="badge" id="termCount">0</span></div>
    <div class="tab" data-page="conns">连接</div>
  </div>
</header>
<main>
  <!-- 终端页 -->
  <div class="page active" id="page-terms">
    <div class="grid" id="termGrid"></div>
    <div class="broadcast">
      <label>广播到</label>
      <div class="chips" id="chips"></div>
      <input id="bcInput" placeholder="输入命令，发给选中的全部会话…" />
      <button class="primary" onclick="broadcast()">发送</button>
    </div>
  </div>
  <!-- 连接页 -->
  <div class="page" id="page-conns">
    <div class="conn-list" id="connList"></div>
    <div style="padding: 0 10px 10px;">
      <div class="conn-form" id="connForm">
        <div class="row">
          <input id="fLabel" placeholder="名称，如 web-01" />
          <select id="fProto"><option value="ssh">SSH</option><option value="telnet">Telnet</option></select>
        </div>
        <div class="row">
          <input id="fHost" placeholder="IP 地址" />
          <input id="fPort" placeholder="端口" style="max-width: 100px;" />
          <input id="fUser" placeholder="用户名（SSH）" />
          <input id="fPass" placeholder="密码" type="password" />
        </div>
        <div class="row" style="justify-content: flex-end; gap: 8px;">
          <button onclick="closeForm()">取消</button>
          <button class="primary" onclick="saveConn()">保存</button>
        </div>
      </div>
      <div style="margin-top: 8px;"><button class="primary" onclick="openForm()">＋ 新建连接</button></div>
    </div>
  </div>
</main>
<div class="foot">原型仅模拟数据 · 真实实现中此处为 SSH/Telnet 实时连接 · 聊天区位于本面板左侧（DSH 原生）</div>

<script>
const CONNS = [
  { id: 'c1', label: 'web-01', proto: 'ssh', host: '10.0.1.5', port: 22, user: 'admin', status: 'off' },
  { id: 'c2', label: 'db-02', proto: 'telnet', host: '10.0.1.8', port: 23, user: '', status: 'off' },
  { id: 'c3', label: 'backup-03', proto: 'ssh', host: '10.0.2.3', port: 22, user: 'root', status: 'off' },
];
const SESSIONS = []; // { id, connId, lines: [] }
let editing = null, seq = 0;

const $ = id => document.getElementById(id);
const FAKE_OUTPUT = cmd => [
  `执行: ${cmd}`,
  '----------------------------------------',
  'Interface      Status    Protocol',
  'Gig0/0         up        up',
  'Gig0/1         up        up',
  'Loopback0      up        up',
  `完成于 ${new Date().toLocaleTimeString()}`,
];

/* ── 页签 ── */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('page-' + t.dataset.page).classList.add('active');
});

/* ── 连接页 ── */
function renderConns() {
  $('connList').innerHTML = CONNS.map(c => `
    <div class="conn">
      <span class="proto ${c.proto}">${c.proto.toUpperCase()}</span>
      <span class="label">${c.label}</span>
      <span class="addr">${c.host}:${c.port}${c.user ? ' · ' + c.user : ''}</span>
      <span class="status ${c.status}">${c.status === 'on' ? '已连接' : c.status === 'connecting' ? '连接中…' : '未连接'}</span>
      <button class="primary" onclick="toggleConn('${c.id}')">${c.status === 'on' ? '断开' : '连接'}</button>
      <button onclick="editConn('${c.id}')">编辑</button>
      <button class="danger" onclick="delConn('${c.id}')">删除</button>
    </div>`).join('');
}
function toggleConn(id) {
  const c = CONNS.find(x => x.id === id);
  if (c.status === 'on') { disconnect(id); return; }
  c.status = 'connecting'; renderConns();
  setTimeout(() => { c.status = 'on'; renderConns(); openSession(c); }, 800);
}
function openSession(c) {
  if (SESSIONS.some(s => s.connId === c.id)) { switchToTerms(); return; }
  const s = { id: 's' + (++seq), connId: c.id, lines: [] };
  SESSIONS.push(s);
  pushLine(s, `[已连接 ${c.host}:${c.port}]`, 'sys');
  pushLine(s, c.proto === 'ssh' ? `Welcome to ${c.label} (SSH)` : `Connected to ${c.label}`, 'sys');
  pushLine(s, promptOf(c), 'sys');
  renderTerms(); switchToTerms();
}
function disconnect(connId) {
  const c = CONNS.find(x => x.id === connId);
  c.status = 'off';
  const i = SESSIONS.findIndex(s => s.connId === connId);
  if (i >= 0) SESSIONS.splice(i, 1);
  renderConns(); renderTerms();
}
function openForm() { editing = null; ['fLabel','fHost','fPort','fUser','fPass'].forEach(id => $(id).value = ''); $('connForm').classList.add('open'); }
function closeForm() { $('connForm').classList.remove('open'); }
function editConn(id) {
  const c = CONNS.find(x => x.id === id); editing = id;
  $('fLabel').value = c.label; $('fProto').value = c.proto; $('fHost').value = c.host;
  $('fPort').value = c.port; $('fUser').value = c.user; $('fPass').value = '';
  $('connForm').classList.add('open');
}
function saveConn() {
  const data = { label: $('fLabel').value || 'unnamed', proto: $('fProto').value, host: $('fHost').value || '127.0.0.1', port: +$('fPort').value || ($('fProto').value === 'ssh' ? 22 : 23), user: $('fUser').value, status: 'off' };
  if (editing) Object.assign(CONNS.find(x => x.id === editing), data);
  else CONNS.push({ id: 'c' + Date.now(), ...data });
  closeForm(); renderConns();
}
function delConn(id) { disconnect(id); const i = CONNS.findIndex(x => x.id === id); if (i >= 0) CONNS.splice(i, 1); renderConns(); }

/* ── 终端页 ── */
const promptOf = c => `${c.label}${c.proto === 'ssh' ? '$' : '>'} `;
function pushLine(s, text, cls) { s.lines.push({ text, cls }); if (s.lines.length > 400) s.lines.shift(); }
function renderTerms() {
  $('termCount').textContent = SESSIONS.length;
  $('termGrid').innerHTML = SESSIONS.length === 0
    ? '<div style="color:var(--dim);padding:30px;">暂无已连接会话 —— 到「连接」页签连接设备</div>'
    : SESSIONS.map(s => {
        const c = CONNS.find(x => x.id === s.connId);
        return `<div class="term">
          <div class="term-bar"><span class="dot"></span><span class="name">${c.label}</span><span class="target">${c.host}:${c.port}</span><button onclick="disconnect('${c.id}')">断开</button></div>
          <div class="term-body" id="body-${s.id}">${s.lines.map(l => `<div class="${l.cls || ''}">${esc(l.text)}</div>`).join('')}</div>
          <div class="term-input"><span>${c.proto === 'ssh' ? '$' : '>'}</span><input id="in-${s.id}" placeholder="输入命令…" onkeydown="if(event.key==='Enter'){sendCmd('${s.id}',this.value);this.value=''}"/></div>
        </div>`;
      }).join('');
  SESSIONS.forEach(s => { const el = $('body-' + s.id); if (el) el.scrollTop = el.scrollHeight; });
  renderChips();
}
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sendCmd(sid, cmd) {
  if (!cmd.trim()) return;
  const s = SESSIONS.find(x => x.id === sid);
  const c = CONNS.find(x => x.id === s.connId);
  pushLine(s, promptOf(c) + cmd, 'cmd');
  stream(s, c, FAKE_OUTPUT(cmd));
}
function stream(s, c, lines) {
  let i = 0;
  const timer = setInterval(() => {
    if (i >= lines.length) { clearInterval(timer); pushLine(s, promptOf(c), 'sys'); renderTerms(); return; }
    pushLine(s, lines[i++]); renderTerms();
  }, 160);
}
function renderChips() {
  $('chips').innerHTML = `<span class="chip on" data-id="*">全部</span>` + SESSIONS.map(s => {
    const c = CONNS.find(x => x.id === s.connId);
    return `<span class="chip on" data-id="${s.id}">${c.label}</span>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    if (ch.dataset.id === '*') { document.querySelectorAll('.chip').forEach(x => x.classList.add('on')); return; }
    ch.classList.toggle('on');
  });
}
function broadcast() {
  const cmd = $('bcInput').value.trim(); if (!cmd) return;
  $('bcInput').value = '';
  const all = document.querySelector('.chip[data-id="*"]').classList.contains('on');
  SESSIONS.forEach(s => {
    if (!all && !document.querySelector(`.chip[data-id="${s.id}"]`)?.classList.contains('on')) return;
    const c = CONNS.find(x => x.id === s.connId);
    pushLine(s, promptOf(c) + cmd + '   [广播]', 'cmd');
    stream(s, c, FAKE_OUTPUT(cmd));
  });
}
function switchToTerms() { document.querySelector('.tab[data-page="terms"]').click(); }

renderConns(); renderTerms();
</script>
</body>
</html>
