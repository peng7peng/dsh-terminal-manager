name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsh-terminal-manager
        uses: actions/checkout@v4

      # setup-node 的 pnpm 缓存需要先装好 pnpm；顺序反了会报 “Unable to locate executable file: pnpm”。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dsh-terminal-manager deps
        run: pnpm install

      - name: Build (tsdown host + browser halves)
        run: pnpm build

      - name: Unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/